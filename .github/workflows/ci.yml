name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test matching benchmark
        run: |
          python scripts/benchmark_matching.py \
            --mode quick \
            --warmups 0 \
            --repeats 1 \
            --output matching-benchmark-smoke.json

      - name: Upload matching benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: matching-benchmark-python-${{ matrix.python-version }}
          path: matching-benchmark-smoke.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up venv
        run: uv venv

      - name: Bootstrap development dependencies
        run: uv pip install --group dev

      - name: Install other dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -n auto

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      - name: Check for dead code
        if: matrix.python-version == '3.10'
        run: uv run python scripts/check_dead_code.py

      - name: Check type hygiene
        if: matrix.python-version == '3.10'
        run: uv run python scripts/check_type_hygiene.py

      - name: Run strict type checks
        if: matrix.python-version == '3.10'
        run: uv run mypy

  minimum-git:
    runs-on: ubuntu-latest
    env:
      GIT_VERSION: "2.31.0"

    steps:
      - uses: actions/checkout@v4

      - name: Check out minimum supported Git
        uses: actions/checkout@v4
        with:
          repository: git/git
          ref: v${{ env.GIT_VERSION }}
          path: git-source
          persist-credentials: false

      - name: Install Git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            build-essential \
            gettext \
            libcurl4-openssl-dev \
            libexpat1-dev \
            zlib1g-dev

      - name: Build minimum supported Git
        run: |
          make -C git-source configure
          cd git-source
          ./configure --prefix="$RUNNER_TEMP/git-${GIT_VERSION}"
          make -j2 all NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          make install NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          echo "$RUNNER_TEMP/git-${GIT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify minimum Git version
        run: test "$(git version)" = "git version ${GIT_VERSION}"

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Set up Python
        run: uv python install 3.10

      - name: Set up test environment
        run: |
          uv venv
          uv pip install --group dev
          uv sync --all-groups

      - name: Run tests with minimum Git
        run: uv run pytest -n auto

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Install gettext
        run: |
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up test environment
        run: |
          uv venv
          uv pip install --group dev
          uv sync --all-groups

      - name: Run tests on macOS
        run: uv run pytest -n auto

      - name: Smoke test process file jobs on macOS
        run: >-
          uv run pytest -n 0
          tests/utils/test_file_jobs.py::test_inline_and_forced_process_runs_return_identical_ordered_results
          tests/utils/test_file_jobs.py::test_process_worker_does_not_inherit_the_parent_session_lock

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Set up Python
        run: uv python install 3.10

      - name: Set up venv
        run: uv venv

      - name: Bootstrap development dependencies
        run: uv pip install --group dev

      - name: Install other dependencies
        run: uv sync --all-groups

      - name: Build distributions
        run: uv build

      - name: Verify wheel installs
        run: |
          uv venv "$RUNNER_TEMP/wheel-install"
          uv pip install \
            --no-config \
            --python "$RUNNER_TEMP/wheel-install/bin/python" \
            dist/*.whl
          "$RUNNER_TEMP/wheel-install/bin/git-stage-batch" --help

      - name: Verify source distribution installs
        run: |
          uv venv "$RUNNER_TEMP/sdist-install"
          uv pip install \
            --no-config \
            --python "$RUNNER_TEMP/sdist-install/bin/python" \
            dist/*.tar.gz
          "$RUNNER_TEMP/sdist-install/bin/git-stage-batch" --help

  sha256-repository:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Set up Python
        run: uv python install 3.10

      - name: Set up venv
        run: uv venv

      - name: Bootstrap development dependencies
        run: uv pip install --group dev

      - name: Install other dependencies
        run: uv sync --all-groups

      - name: Report Git object-format support
        run: |
          git --version
          probe=$(mktemp -d)
          if git init --object-format=sha256 "$probe"; then
            git -C "$probe" rev-parse --show-object-format
          else
            echo "Installed Git does not support SHA-256 repositories"
          fi

      - name: Run SHA-256 repository workflows
        run: uv run pytest -n auto tests/functional/test_sha256_repository.py
